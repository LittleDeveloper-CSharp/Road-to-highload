# OTLP: метрики приложения (через otel-collector → /api/v1/otlp).
# scrape: postgres_exporter (БД).
storage:
  tsdb:
    out_of_order_time_window: 30m

otlp:

scrape_configs:
  - job_name: postgres
    scrape_interval: 5s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: postgres
